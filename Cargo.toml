[package]
name = "prism"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
ansi-to-tui = "8.0.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
color-eyre = "0.6.5"
crossterm = { version = "0.29", features = ["event-stream"] }
directories = "6.0.0"
futures = "0.3.34"
jiff = "0.2.38"
nucleo-matcher = "0.3.1"
open = "5.4.5"
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "process", "sync", "time"] }
tui-input = "0.15.5"
tui-markdown = { version = "0.3.13", default-features = false }
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3.27.0"
