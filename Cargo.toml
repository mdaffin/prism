[package]
name = "gh-prui"
version = "0.1.0"
edition = "2024"

[dependencies]
ansi-to-tui = "8.0.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
color-eyre = "0.6.5"
crossterm = { version = "0.29", features = ["event-stream"] }
futures = "0.3.34"
ratatui = "0.30.2"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "process", "sync", "time"] }
tui-input = "0.15.5"
